name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      CLOUDFRONT_WWW_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_WWW_DISTRIBUTION_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Preview S3 synchronization
        run: aws s3 sync dist/ "s3://${S3_BUCKET}/" --delete --dryrun --cache-control "no-cache"

      - name: Upload site to S3
        run: aws s3 sync dist/ "s3://${S3_BUCKET}/" --cache-control "no-cache"

      - name: Invalidate CloudFront caches
        run: |
          for distribution_id in \
            "$CLOUDFRONT_DISTRIBUTION_ID" \
            "$CLOUDFRONT_WWW_DISTRIBUTION_ID"; do
            if [ -n "$distribution_id" ]; then
              aws cloudfront create-invalidation \
                --distribution-id "$distribution_id" \
                --paths '/*'
            fi
          done
