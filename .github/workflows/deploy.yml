name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOYMENT_RUN_ID: ${{ github.run_id }}

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build production bundle
        run: bun run build

      - name: Upload verified build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      CLOUDFRONT_WWW_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_WWW_DISTRIBUTION_ID }}

    steps:
      - name: Download verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Preview S3 synchronization
        run: aws s3 sync dist/ "s3://${S3_BUCKET}/" --delete --dryrun --cache-control "no-cache"

      - name: Upload site to S3
        run: aws s3 sync dist/ "s3://${S3_BUCKET}/" --cache-control "no-cache"

      - name: Invalidate CloudFront caches
        run: |
          for distribution_id in \
            "$CLOUDFRONT_DISTRIBUTION_ID" \
            "$CLOUDFRONT_WWW_DISTRIBUTION_ID"; do
            if [ -n "$distribution_id" ]; then
              aws cloudfront create-invalidation \
                --distribution-id "$distribution_id" \
                --paths '/*'
            fi
          done
